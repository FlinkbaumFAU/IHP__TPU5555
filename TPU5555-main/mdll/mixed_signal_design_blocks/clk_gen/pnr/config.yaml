# clk_gen hardening -- LibreLane, IHP sg13g2 (and sg13cmos5l).
#
# Netlist is already fully mapped (common/pnr/mk_netlist.py), so synthesis only
# elaborates. That is deliberate: the ring oscillator is an intentional
# combinational loop and delay_cell's cross-coupled inverters are a latch --
# letting Yosys re-optimise that risks it "simplifying" the oscillator away.

DESIGN_NAME: clk_gen
VERILOG_FILES:
  - dir::../build/01-synth/clk_gen.flat.v
SYNTH_ELABORATE_ONLY: true

# STD_CELL_LIBRARY is left to the PDK's default (sg13g2_stdcell or
# sg13cmos5l_stdcell): set here, it would apply to both.

# SG13CMOS5L (`make harden_cmos5l`): the same netlist with its cells renamed
# sg13g2_* -> sg13cmos5l_* by common/pnr/retarget.py -- the two libraries are
# the same cells under another prefix. The metal stacks are identical up to
# Metal4 and this block stays on Metal1..Metal3, so nothing else changes.
"pdk::ihp-sg13cmos5l":
  VERILOG_FILES:
    - dir::../build/sg13cmos5l/clk_gen.flat.v

# The input is a pre-mapped gate netlist, not RTL, so verilator has no source
# for sg13g2_*/custom_cap_4 and reports every one as MODMISSING. Linting a
# netlist the tools already mapped buys nothing.
RUN_LINTER: false

# delay_cell drives `out` from BOTH the forward inverter (x13) and the
# cross-coupled inverter (x11) -- likewise `outb` from x14/x12. That is the
# pseudo-differential latch: the cross-coupled pair fighting the forward path is
# what enforces complementarity. Yosys reports it as "multiple conflicting
# drivers" on 8 nets, which is correct for digital logic and wrong for this
# circuit. Nothing else is reported (verified in
# pnr/runs/*/02-yosys-synthesis/reports/chk.rpt), so the check is demoted rather
# than silenced blind -- re-read that report whenever the netlist changes.
QUIT_ON_SYNTH_CHECKS: false

# clk_ref is the only real input clock. clk_out is generated by the ring and
# clocks the divider; it is constrained in pnr/base.sdc, not here.
CLOCK_PORT: clk_ref
CLOCK_PERIOD: 10
PNR_SDC_FILE: dir::base.sdc
SIGNOFF_SDC_FILE: dir::base.sdc

# Switched unit capacitors. dont_use/dont_touch in the Liberty keeps synthesis
# from inferring or deleting them; the LEF makes them row-placeable.
EXTRA_LEFS:
  - dir::../../../custom_stdcell/custom_stdcell.lef
EXTRA_LIBS:
  - dir::../../../custom_stdcell/custom_stdcell.lib
EXTRA_GDS_FILES:
  - dir::../../../custom_stdcell/custom_stdcell.gds
# OpenROAD.WriteCDL needs a CDL for every master, including the custom cells.
EXTRA_CDLS:
  - dir::../../../custom_stdcell/custom_stdcell.cdl

# ---------------------------------------------------------------------------
# Layer budget: Metal1..Metal3 only.
#
# PDK defaults put the PDN on TopMetal1/TopMetal2 and allow routing up to
# TopMetal2 -- seven layers. This design is ~200 cells, so it does not need
# them. Metal1 rails (horizontal, follow the rows), Metal2 vertical straps to
# bridge up, Metal3 horizontal stripes promoted to the block's power pins.
#
# Metal2 straps are required, not optional: Metal1 and Metal3 are both
# HORIZONTAL in this stack, so they never cross and cannot be via-stacked
# directly. Metal2 is the only vertical layer below Metal4.
# ---------------------------------------------------------------------------
RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal3

PDN_RAIL_LAYER: Metal1
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3
PDN_MULTILAYER: true
PDN_ENABLE_RAILS: true
PDN_CORE_RING: false

# Promote the straps to block pins and run them out to the die boundary, so
# Metal3 carries the power pins.
PDN_ENABLE_PINS: true

# Stripes stop at the core, NOT the die boundary.
#
# With `boundary`, the Metal2 verticals run to the north/south die edges and the
# Metal3 horizontals to the east/west edges, so EVERY edge carries power pins and
# signal pins collide with them wherever they coincide. run8 shorted C[4]/C[5]
# against Metal3 bands on the east edge; moving signals to north/south in run9
# just shifted the problem onto the full-height Metal2 straps (LVS: C[1], C[5]
# and VPWR extracted as one net).
#
# Insetting to the core leaves the whole die margin free for signal pins. The
# stripes are still promoted to block pins -- a parent connects by dropping vias
# from Metal4+ onto them, which this design leaves entirely free anyway.
PDN_EXTEND_TO: core_ring

# Sized for a ~75 um die: the PDK defaults (2.2 um wide, 75.6 um pitch) are
# TopMetal geometry and would yield barely one stripe here.
PDN_VWIDTH: 1.2
PDN_VSPACING: 1.2
PDN_VPITCH: 20
PDN_VOFFSET: 5
PDN_HWIDTH: 1.2
PDN_HSPACING: 1.2
PDN_HPITCH: 20
PDN_HOFFSET: 5

# Signal pins: Metal2 is vertical (top/bottom edges), Metal3 horizontal
# (left/right edges). Same as the PDK default, restated because the layer
# budget above makes them the only choices.
IO_PIN_V_LAYER: Metal2
IO_PIN_H_LAYER: Metal3

# All signal pins forced to north/south, i.e. onto IO_PIN_V_LAYER (Metal2).
#
# PDN_HORIZONTAL_LAYER is Metal3 and the stripes are promoted to pins extending
# to the boundary, so they span the full die width and terminate on the EAST and
# WEST edges. IO_PIN_H_LAYER is Metal3 too, so horizontal signal pins land on
# those same edges and compete for them -- run8 put C[4]/C[5] hard against a
# VGND band (0.04 um clearance against the 0.21 um M3.b rule) and the router
# could not resolve it. Moving every signal pin to north/south leaves the
# east/west edges entirely to the Metal3 power pins.
#
# NOTE: pin_order.cfg has no comment syntax -- '#' introduces a direction
# (#N/#S/#E/#W), so a '# comment' line is parsed as a malformed direction.
IO_PIN_ORDER_CFG: dir::pin_order.cfg
ERRORS_ON_UNMATCHED_IO: both

# Absolute: the die as it was at 35 % utilisation before the dithering decoder
# (2026-10-29) added ~65 cells, which at 35 % grew the die to 113 x 117 um and
# onto the top level's replica cells (x5/x7/x8 sit just above clk_gen in
# pnr/config.yaml). The old die keeps every pin where the top level expects
# it; utilisation is ~44 %.
FP_SIZING: absolute
DIE_AREA: [0, 0, 101.07, 104.67]

# Core margins. The defaults are 4 site *heights* top/bottom but 12 site
# *widths* left/right -- and a site is 3.780 um tall vs 0.480 wide, so that is
# 15.12 um of vertical margin against 5.76 um horizontal. Two rows top and
# bottom (7.56 um) still leaves room for the Metal2 pins to reach the core from
# the top/bottom edges, and brings the die closer to the core.
TOP_MARGIN_MULT: 2
BOTTOM_MARGIN_MULT: 2

# No resizer buffers on the outputs: div, sel and clk_out each have an explicit
# sg13g2_buf_1 in the schematic (divider x9, clk_gen x15, x14). div's must be
# replicated exactly at the top level, where mdll.sch passes clk_ref through
# the same lgcp_1 + buf_1 chain so the gate delays cancel at the tdc and bbpd
# -- a buffer the resizer adds on its own is one the replica does not have.
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false

# The only flops are in the divider, clocked by the ring output. A clock tree
# on a ring-derived clock is meaningless here.
RUN_CTS: false

# LVS reference: no pad CDLs (there are no pads), and a comment-only CDL in
# their place that is longer than the write buffer LibreLane's KLayout.LVS
# never flushes -- see common/pnr/cdl_tail.cdl. Without it, the end of the
# last CDL silently goes missing from the reference netlist.
PAD_CDLS:
  - dir::../../common/pnr/cdl_tail.cdl

# Signoff via KLayout; magic is disabled for this project.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_DRC: false
RUN_MAGIC_WRITE_LEF: true
RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_DRC: true

meta:
  version: 2
  flow: Classic
  substituting_steps:
    # No magic anywhere (2026-10-23): the PDK's sg13cmos5l magic tech needs
    # magic >= 8.3.657 and LibreLane 3.0.16's shell has 8.3.623, which then
    # cannot read the standard cells and spins forever in Magic.WriteLEF.
    # LibreLane 3.0.16 has no other step that writes the design LEF, so the
    # root Makefile's `macros` writes each block's LEF from its final ODB with
    # OpenROAD's write_abstract_lef (common/pnr/write_lef.tcl), as LibreLane's
    # own OpenROAD LEF would. Odb.CheckDesignAntennaProperties only reads the
    # flow's LEF, so it goes too. Magic's StreamOut and DRC are gated off by
    # default.
    Magic.WriteLEF: null
    Odb.CheckDesignAntennaProperties: null
    Magic.SpiceExtraction: OpenROAD.WriteCDL
    Checker.IllegalOverlap: null
    Netgen.LVS: KLayout.LVS
