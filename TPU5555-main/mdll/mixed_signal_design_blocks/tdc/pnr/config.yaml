# tdc hardening -- LibreLane, IHP sg13g2 (and sg13cmos5l).
#
# Netlist is already fully mapped (common/pnr/mk_netlist.py), so synthesis only
# elaborates: the two Vernier rings are deliberate combinational loops, and
# the phase detector and edge-lock detector are hand-picked flops operated
# metastable on purpose. A resynthesis would be free to resize or "simplify"
# every one of them, and the rings' matching is the whole point of the block.

DESIGN_NAME: tdc
VERILOG_FILES:
  - dir::../build/01-synth/tdc.flat.v
SYNTH_ELABORATE_ONLY: true

# STD_CELL_LIBRARY: the PDK's default. SG13CMOS5L (`make harden_cmos5l`):
# the same netlist, cells renamed -- see clk_gen/pnr/config.yaml.
"pdk::ihp-sg13cmos5l":
  VERILOG_FILES:
    - dir::../build/sg13cmos5l/tdc.flat.v

# Pre-mapped gate netlist, not RTL: verilator has no source for sg13g2_* or
# custom_cap_4 and would report every one as MODMISSING.
RUN_LINTER: false

CLOCK_PORT: Clk_ref
CLOCK_PERIOD: 10
PNR_SDC_FILE: dir::base.sdc
SIGNOFF_SDC_FILE: dir::base.sdc

# The rings' trim capacitors. Same cells and the same four views clk_gen uses.
EXTRA_LEFS:
  - dir::../../../custom_stdcell/custom_stdcell.lef
EXTRA_LIBS:
  - dir::../../../custom_stdcell/custom_stdcell.lib
EXTRA_GDS_FILES:
  - dir::../../../custom_stdcell/custom_stdcell.gds
EXTRA_CDLS:
  - dir::../../../custom_stdcell/custom_stdcell.cdl

# ---------------------------------------------------------------------------
# Layer budget and PDN: the clk_gen recipe verbatim (DRC 0 / LVS clean at
# run12 and run13; bbpd reused it unchanged). See clk_gen/pnr/config.yaml for
# the reasoning behind each line -- in short: Metal1..Metal3 only, Metal2
# straps because Metal1 and Metal3 are both horizontal, stripes inset to the
# core so signal pins never collide with power pins.
# ---------------------------------------------------------------------------
RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal3

PDN_RAIL_LAYER: Metal1
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3
PDN_MULTILAYER: true
PDN_ENABLE_RAILS: true
PDN_CORE_RING: false
PDN_ENABLE_PINS: true
PDN_EXTEND_TO: core_ring

PDN_VWIDTH: 1.2
PDN_VSPACING: 1.2
PDN_VPITCH: 20
PDN_VOFFSET: 5
PDN_HWIDTH: 1.2
PDN_HSPACING: 1.2
PDN_HPITCH: 20
PDN_HOFFSET: 5

IO_PIN_V_LAYER: Metal2
IO_PIN_H_LAYER: Metal3

# All signal pins north/south (Metal2), east/west left to the Metal3 power
# pins -- the clk_gen rule.
#
# Clk_out and Clk_ref are ADJACENT on the north edge. They start the slow and
# fast rings respectively, so any difference between their two pin-to-flop
# routes is added straight onto every measured interval. Same reasoning as
# bbpd's clk_ref/div pair.
#
# NOTE: pin_order.cfg has no comment syntax -- '#' introduces a direction.
IO_PIN_ORDER_CFG: dir::pin_order.cfg
ERRORS_ON_UNMATCHED_IO: both

FP_SIZING: relative
FP_CORE_UTIL: 35
TOP_MARGIN_MULT: 2
BOTTOM_MARGIN_MULT: 2

# No clock tree. Every clock here is either a ring output (a tree would add
# delay inside what is supposed to be a matched pair) or an event clock with a
# handful of sinks.
RUN_CTS: false

# LVS reference: no pads, and see common/pnr/cdl_tail.cdl.
PAD_CDLS:
  - dir::../../common/pnr/cdl_tail.cdl

# Signoff via KLayout; magic is disabled for this project.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_DRC: false
RUN_MAGIC_WRITE_LEF: true
RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_DRC: true

meta:
  version: 2
  flow: Classic
  substituting_steps:
    # No magic anywhere (2026-10-23): the PDK's sg13cmos5l magic tech needs
    # magic >= 8.3.657 and LibreLane 3.0.16's shell has 8.3.623, which then
    # cannot read the standard cells and spins forever in Magic.WriteLEF.
    # LibreLane 3.0.16 has no other step that writes the design LEF, so the
    # root Makefile's `macros` writes each block's LEF from its final ODB with
    # OpenROAD's write_abstract_lef (common/pnr/write_lef.tcl), as LibreLane's
    # own OpenROAD LEF would. Odb.CheckDesignAntennaProperties only reads the
    # flow's LEF, so it goes too. Magic's StreamOut and DRC are gated off by
    # default.
    Magic.WriteLEF: null
    Odb.CheckDesignAntennaProperties: null
    Magic.SpiceExtraction: OpenROAD.WriteCDL
    Checker.IllegalOverlap: null
    Netgen.LVS: KLayout.LVS
